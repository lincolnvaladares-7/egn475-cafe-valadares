
{% extends "base.html" %}

{% block title %}Item Details{% endblock %}

{% block content %}
<article>
    <h1>{{ item.name }}</h1>

    <p>Category: {{ item.category }}</p>

    <p>Price: ${{ "%.2f"|format(item.price_cents / 100) }}</p>

    <a href="{{ url_for('new_order') }}" role="button">
        Place Order
    </a>

    <a href="{{ url_for('menu') }}">
        Back to Menu
    </a>
</article>
{% endblock %}

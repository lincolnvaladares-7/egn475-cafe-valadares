
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Cafe Calle Ocho{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
</head>
<body>
    <nav class="container">
        <ul>
            <li><strong>Cafe Calle Ocho</strong></li>
        </ul>
        <ul>
            <li><a href="{{ url_for('index') }}" {% if request.endpoint == 'index' %}aria-current="page"{% endif %}>Home</a></li>
            <li><a href="{{ url_for('menu') }}" {% if request.endpoint in ['menu', 'item_detail'] %}aria-current="page"{% endif %}>Menu</a></li>
            <li><a href="{{ url_for('new_order') }}" {% if request.endpoint == 'new_order' %}aria-current="page"{% endif %}>Order</a></li>
            <li><a href="{{ url_for('kitchen') }}" {% if request.endpoint == 'kitchen' %}aria-current="page"{% endif %}>Kitchen</a></li>
            <li><a href="{{ url_for('orders') }}" {% if request.endpoint == 'orders' %}aria-current="page"{% endif %}>History</a></li>
        </ul>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="container">
        <small>Cafe Calle Ocho | EGN 475 Prototype</small>
    </footer>
</body>
</html>
